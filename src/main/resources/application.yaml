rugdar:
  ai:
    enabled: true
    system-prompt: >
      You are a crypto market analyst.
      Analyze the provided market data summary covering the last week,
      including trend indicators (SMA20 and EMA20),
      and give a concise market overview.
  analysis:
    interval-minutes: 60
    history-days: 7
  storage:
    flush-interval-ms: 10000
    cleanup-interval-ms: 3600000
    retention-days: 7
  exchanges:
    bybit:
        url: wss://stream.bybit.com/v5/public/spot
        symbols: BTCUSDT,ETHUSDT
    whitebit:
        url: wss://api.whitebit.com/ws
        symbols: BTC_USDT,ETH_USDT
    binance:
        url: wss://stream.binance.com:9443/ws
        symbols: BTCUSDT,ETHUSDT
    okx:
      url: wss://ws.okx.com:8443/ws/v5/public
      symbols: BTC-USDT,ETH-USDT

spring:
  application:
    name: rugdar
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?TimeZone=UTC
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    validate-migration-naming: true
  mongodb:
    database: Cluster0
    uri: ${MONGODB_URI}
    representation:
      uuid: STANDARD
  ai:
    openai:
      api-key: ${AI_GATEWAY_API_KEY}
      base-url: https://ai-gateway.vercel.sh/v1
      chat:
        model: deepseek/deepseek-v4-pro-0813

server:
  port: 8081
